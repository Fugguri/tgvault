name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Быстрая проверка без сборки whisper.cpp. `third_party/` в репозиторий не
  # входит (gitignore), поэтому ни заголовков whisper.h, ни собранных либ здесь
  # нет — пакет transcribe собирается через native_stub.go (`//go:build !cgo`),
  # отсюда CGO_ENABLED=0.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "не отформатировано gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./internal/...
      # -race требует cgo, а с cgo transcribe без whisper.h не собрать. Тестов
      # в transcribe нет, сам пакет проверяется в job'е build.
      - name: test
        run: |
          pkgs="$(CGO_ENABLED=0 go list ./internal/... | grep -v '/internal/transcribe$')"
          go test -race -count=1 $pkgs

  # cmd/tgvault импортирует internal/transcribe (cgo), поэтому тут нужны
  # статические либы whisper.cpp. Job ловит поломку интерфейсов на стороне main
  # и сверяет вывод CLI с эталоном — то, что тесты пакетов не видят.
  #
  # Кэша сборки здесь нет намеренно. Восстановление каталога
  # third_party/whisper.cpp/build_go создавало сам third_party/whisper.cpp, и
  # `make whisper-libs` считал исходники уже склонированными: клон молча
  # пропускался, cmake падал без CMakeLists.txt. Сборка либ занимает пару минут —
  # дешевле собирать каждый раз, чем ловить это снова.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build whisper.cpp (static)
        run: make whisper-libs WHISPER_GGML_NATIVE=OFF
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # Сверяет вывод CLI с эталоном — ловит правки, меняющие поведение команд,
      # которые тесты пакетов не видят.
      - name: Golden CLI
        run: go test ./cmd/tgvault -run TestCLIGolden

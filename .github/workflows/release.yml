name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # cgo + статическая линковка whisper.cpp: каждый бинарь собирается нативно
    # под свою ОС/арх (кросс-компиляция cgo невозможна без кросс-тулчейна).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: tgvault_linux_amd64
          # macos-13 ретайрнут (job висит в очереди вечно) — Intel-образ теперь macos-15-intel.
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            asset: tgvault_darwin_amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset: tgvault_darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build whisper.cpp (static)
        run: make whisper-libs WHISPER_GGML_NATIVE=OFF
      - name: Build tgvault
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o ${{ matrix.asset }} ./cmd/tgvault
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
